name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-24.04

    strategy:
      # Each Node version reports on its own: one red job never cancels the others.
      fail-fast: false
      matrix:
        # Node 18 and 20 are end-of-life; package.json engines is >=22.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Node tests
        run: npm run test:node

      - name: Build
        run: npm run build

      - name: Verify packed consumer install and types
        run: npm run verify:package

      # Bundle ceilings (scripts/check-bundle-budget.mjs). Reported on every run; it becomes a
      # blocking step once the ceilings are re-baselined or the bundles trimmed back under them.
      - name: Bundle budget (informational)
        run: npm run check:budget
        continue-on-error: true

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # The library suite: vite's dev server on src and the collab relay (tests/collab-server-standalone.cjs),
      # both started by playwright.config.ts. Nothing here needs a live app: the real-consumer specs
      # (tests/e2e/app-*.spec.ts) run only through playwright.app.config.ts (npm run test:app), locally.
      - name: E2E tests (Chromium)
        run: npx playwright test --project=chromium

      # A red E2E run leaves its report, traces and videos to read (the step after a failed one is skipped otherwise).
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  cross-browser:
    runs-on: ubuntu-24.04
    needs: test-and-build

    strategy:
      matrix:
        browser: [firefox, webkit]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: E2E tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        continue-on-error: true
