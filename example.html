<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlateboxJS v2 - Simple Example</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            flex-wrap: wrap;
        }
        
        .controls button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .controls button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .controls button:active {
            transform: translateY(0);
        }
        
        #slate {
            width: 100%;
            height: 500px;
            background: #ffffff;
        }
        
        .status {
            padding: 15px 20px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 500;
            border-top: 1px solid #c8e6c9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SlateboxJS v2</h1>
            <p>Simple Example - Drag and Drop Nodes</p>
        </div>
        
        <div class="controls">
            <button onclick="addNode()">Add Node</button>
            <button onclick="addCircle()">Add Circle</button>
            <button onclick="addRandomNodes()">Add 5 Random</button>
            <button onclick="lockAll()">Lock All</button>
            <button onclick="unlockAll()">Unlock All</button>
            <button onclick="clearAll()">Clear All</button>
        </div>
        
        <div id="slate"></div>
        
        <div class="status">
            Ready! Click buttons above to add nodes, then drag them around.
        </div>
    </div>

    <script type="module">
        import SlateboxJS from './dist/slateboxjs.mjs'

        // Initialize the slate
        const slate = SlateboxJS('#slate', {
            viewPort: {
                originalWidth: 900,
                originalHeight: 500
            },
            containerStyle: {
                backgroundColor: '#fafafa'
            }
        })

        // Global reference for demo functions
        window.slate = slate

        // Demo functions
        window.addNode = function() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff']
            const color = colors[Math.floor(Math.random() * colors.length)]
            
            slate.addNode({
                id: 'node_' + Date.now(),
                x: Math.random() * 600 + 50,
                y: Math.random() * 300 + 50,
                width: 140,
                height: 70,
                text: 'Drag me!',
                backgroundColor: color,
                borderColor: '#333',
                borderWidth: 2,
                fontSize: 16,
                fontColor: '#333'
            })
            updateStatus()
        }

        window.addCircle = function() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff']
            const color = colors[Math.floor(Math.random() * colors.length)]
            
            slate.addNode({
                id: 'circle_' + Date.now(),
                x: Math.random() * 600 + 50,
                y: Math.random() * 300 + 50,
                width: 80,
                height: 80,
                text: '●',
                backgroundColor: color,
                borderColor: '#333',
                borderWidth: 2,
                shape: 'circle',
                fontSize: 20
            })
            updateStatus()
        }

        window.addRandomNodes = function() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    if (Math.random() > 0.5) {
                        addNode()
                    } else {
                        addCircle()
                    }
                }, i * 100)
            }
        }

        window.lockAll = function() {
            slate.getAllNodes().forEach(node => {
                node.lock()
            })
            updateStatus('All nodes locked')
        }

        window.unlockAll = function() {
            slate.getAllNodes().forEach(node => {
                node.unlock()
            })
            updateStatus('All nodes unlocked')
        }

        window.clearAll = function() {
            slate.nodes.clear()
            updateStatus('All nodes cleared')
        }

        function updateStatus(message) {
            const statusEl = document.querySelector('.status')
            const count = slate.getAllNodes().length
            statusEl.textContent = message || `${count} node${count !== 1 ? 's' : ''} on canvas. Drag them around!`
        }

        // Add initial nodes
        setTimeout(() => {
            addNode()
            addCircle()
            updateStatus()
        }, 100)

        console.log('SlateboxJS v2 Example loaded!')
    </script>
</body>
</html>
