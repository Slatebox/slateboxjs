<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlateboxJS v2 - Demo</title>
    <link rel="stylesheet" href="./dist/slateboxjs.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5em;
            font-weight: 300;
        }

        .header-controls {
            display: flex;
            gap: 10px;
        }

        .header-controls button {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .header-controls button:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-controls button.danger {
            background: rgba(255,100,100,0.3);
            border-color: rgba(255,100,100,0.5);
        }

        #slate {
            width: 100%;
            height: 700px;
            background: #fafafa;
            position: relative;
        }

        .info-bar {
            padding: 10px 20px;
            background: #f0f0f0;
            color: #666;
            font-size: 13px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SlateboxJS v2</h1>
            <div class="header-controls">
                <button onclick="addNode()">+ Rectangle</button>
                <button onclick="addCircle()">+ Circle</button>
                <button onclick="clearAll()" class="danger">Clear</button>
            </div>
        </div>

        <div id="slate"></div>

        <div class="info-bar">
            Two-finger scroll to pan (with momentum) • Cmd/Ctrl+scroll or pinch to zoom • Click node to select • Drag to move
        </div>
    </div>

    <script type="module">
        import SlateboxJS from './dist/slateboxjs.es.js'

        // Initialize the slate with pan/zoom and momentum scrolling
        const slate = SlateboxJS('#slate', {
            viewPort: {
                originalWidth: 1200,
                originalHeight: 700
            },
            containerStyle: {
                backgroundColor: '#fafafa'
            },
            panZoom: {
                enabled: true,
                panning: true,
                pinchZoom: true,
                wheelZoom: true,
                momentum: true,
                momentumSlowdown: 0.8,
                zoomFactor: 0.3,
                zoomMin: 0.1,
                zoomMax: 5
            },
            birdsEye: {
                enabled: true,
                width: 200,
                height: 150
            }
        })

        // Global reference for demo functions
        window.slate = slate
        let nodeCounter = 1

        const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff']

        window.addNode = function() {
            const color = colors[Math.floor(Math.random() * colors.length)]
            slate.addNode({
                id: 'rect_' + nodeCounter++,
                x: Math.random() * 800 + 100,
                y: Math.random() * 400 + 100,
                width: 120 + Math.random() * 80,
                height: 70 + Math.random() * 50,
                text: `Node ${nodeCounter - 1}`,
                backgroundColor: color,
                borderColor: '#333',
                borderWidth: 2,
                fontSize: 14,
                fontColor: '#333'
            })
        }

        window.addCircle = function() {
            const color = colors[Math.floor(Math.random() * colors.length)]
            slate.addNode({
                id: 'circle_' + nodeCounter++,
                x: Math.random() * 800 + 100,
                y: Math.random() * 400 + 100,
                width: 80 + Math.random() * 40,
                height: 80 + Math.random() * 40,
                text: `Circle ${nodeCounter - 1}`,
                backgroundColor: color,
                borderColor: '#333',
                borderWidth: 2,
                shape: 'circle',
                fontSize: 14
            })
        }

        window.clearAll = function() {
            slate.nodes.clear()
            nodeCounter = 1
        }

        // Add initial demo nodes
        setTimeout(() => {
            addNode()
            addCircle()
            console.log('SlateboxJS v2 Demo loaded with momentum scrolling!')
        }, 100)
    </script>
</body>
</html>
