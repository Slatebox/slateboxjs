<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlateboxJS E2E Test Page</title>
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // Load SlateboxJS from source (works with Vite dev server)
      import SlateboxJS from "/src/index.ts";

      // Store original factory
      const originalFactory = SlateboxJS;

      // Expose a wrapper that tracks the current slate instance
      window.SlateboxJS = function (selector, options) {
        const slate = originalFactory(selector, options);
        window.currentSlate = slate;
        window.testSlate = slate;
        return slate;
      };

      console.log("Test page ready - SlateboxJS loaded");
    </script>
  </body>
</html>
